# Prueba local de la arquitectura completa:
#   docker compose up --build    ->  http://localhost:8080
# El servicio "alb-local" imita al ALB de AWS: /api/* al backend, el resto al frontend.
services:
  backend:
    build: ./backend
    environment:
      APP_VERSION: local-compose

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: local-compose

  alb-local:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./alb-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
