# PIPELINE 3 - Despliegue en Amazon ECS
#
#  Se dispara solo cuando el Pipeline 2 termina bien (o manualmente con un tag,
#  útil para volver a una versión anterior).
#  1. Verifica que las imágenes del commit existen en ECR.
#  2. Registra una nueva task definition por servicio y actualiza ECS.
#  3. Espera a que los servicios estén estables (rollback si fallan).
#  4. Smoke test contra el ALB: la app debe responder con la versión nueva.
name: "3 - Despliegue en ECS"

on:
  workflow_run:
    workflows: ["2 - Build y publicación en ECR"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de imagen a desplegar (SHA completo del commit)"
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ecs
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar en ECS
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ steps.smoke.outputs.url }}
    env:
      TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}
      PROJECT: ${{ vars.PROJECT_NAME }}
      CLUSTER: ${{ vars.PROJECT_NAME }}-cluster
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verificar imágenes en ECR
        run: |
          for svc in backend frontend; do
            aws ecr describe-images --repository-name "$PROJECT-$svc" \
              --image-ids imageTag="$TAG" >/dev/null \
              || { echo "::error::No existe $PROJECT-$svc:$TAG en ECR"; exit 1; }
            echo "OK $PROJECT-$svc:$TAG"
          done

      - name: Desplegar backend
        run: |
          bash pipelines/scripts/deploy-ecs-service.sh \
            "$CLUSTER" backend "${{ steps.ecr.outputs.registry }}/$PROJECT-backend:$TAG"

      - name: Desplegar frontend
        run: |
          bash pipelines/scripts/deploy-ecs-service.sh \
            "$CLUSTER" frontend "${{ steps.ecr.outputs.registry }}/$PROJECT-frontend:$TAG"

      - name: Comprobar que la aplicación está operativa
        id: smoke
        run: |
          DNS=$(aws elbv2 describe-load-balancers --names "$PROJECT-alb" \
                  --query 'LoadBalancers[0].DNSName' --output text)
          echo "url=http://$DNS" >> "$GITHUB_OUTPUT"
          bash pipelines/scripts/smoke-test.sh "http://$DNS" "$TAG"

      - name: Resumen
        run: |
          {
            echo "## Despliegue completado"
            echo "- Versión: \`$TAG\`"
            echo "- Aplicación: ${{ steps.smoke.outputs.url }}"
            echo "- API docs: ${{ steps.smoke.outputs.url }}/api/docs"
          } >> "$GITHUB_STEP_SUMMARY"
