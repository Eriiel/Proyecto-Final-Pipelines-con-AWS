# PIPELINE 1 - Infraestructura como código (Terraform -> AWS)
#
#  - Push/PR que toque terraform/  -> solo "plan" (revisión, no cambia nada).
#  - Ejecución manual (Actions > Run workflow) -> plan, apply o destroy.
#    El apply/destroy espera aprobación en el environment "infraestructura".
name: "1 - Infraestructura (Terraform)"

on:
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/1-infraestructura.yml"]
  pull_request:
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué hacer con la infraestructura"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write # necesario para OIDC con AWS
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: Validar y planificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales AWS (OIDC, sin llaves guardadas)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: |
          EXTRA=""
          if [ "${{ inputs.accion }}" = "destroy" ]; then EXTRA="-destroy"; fi
          terraform plan -input=false -out=tfplan $EXTRA
          terraform show -no-color tfplan > plan.txt

      - name: Resumen del plan
        run: |
          {
            echo "## Plan de Terraform (${{ inputs.accion || 'plan' }})"
            echo '```'
            grep -E "^Plan:|No changes|to destroy" plan.txt || tail -5 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          include-hidden-files: true
          path: |
            terraform/tfplan
            terraform/.terraform.lock.hcl
          retention-days: 1

  apply:
    name: Aplicar (${{ inputs.accion }})
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.accion != 'plan'
    runs-on: ubuntu-latest
    environment: infraestructura # aprobación manual antes de tocar AWS
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"

      - name: Descargar plan aprobado
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform apply
        run: terraform apply -input=false tfplan

      - name: Salidas
        if: inputs.accion == 'apply'
        run: |
          {
            echo "## Infraestructura creada"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
